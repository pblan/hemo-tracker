name: Dependency review

on:
  pull_request:
    paths:
      - "package.json"
      - "bun.lock"
      - "**/package.json"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".github/workflows/dependency-review.yml"

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
