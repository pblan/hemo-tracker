name: Encrypted vault proof

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/encrypted-vault-proof.yml"
      - "proofs/encrypted-vault/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/encrypted-vault-proof.yml"
      - "proofs/encrypted-vault/**"

permissions:
  contents: read

concurrency:
  group: encrypted-vault-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Install stock SQLite on Windows
        if: runner.os == 'Windows'
        run: choco install sqlite --version=3.53.4 --yes --no-progress
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: proofs/encrypted-vault
      - run:
          cargo fmt --manifest-path proofs/encrypted-vault/Cargo.toml -- --check
      - run:
          cargo clippy --manifest-path proofs/encrypted-vault/Cargo.toml
          --all-targets -- -D warnings
      - run:
          cargo test --locked --manifest-path proofs/encrypted-vault/Cargo.toml
