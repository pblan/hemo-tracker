name: Unsigned V1 release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate semantic tag and application version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(node -p "require('./apps/desktop/package.json').version")
          if [[ "$tag" != "$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match application version $version"
            exit 1
          fi

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundles: app
            artifact: macos
          - os: windows-latest
            bundles: nsis
            artifact: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: bun install --frozen-lockfile
      - run:
          bun run --cwd apps/desktop tauri build --bundles ${{ matrix.bundles }}
      - name: Package unsigned artifacts
        shell: bash
        run: |
          mkdir release-${{ matrix.artifact }}
          find apps/desktop/src-tauri/target/release/bundle -type f \( -name '*.app' -o -name '*.exe' -o -name '*.msi' -o -name '*.dmg' \) -exec cp -R {} release-${{ matrix.artifact }}/ \; || true
          printf 'Hemo Tracker %s is unsigned. The operating system may show an unverified-publisher warning.\n' "$GITHUB_REF_NAME" > release-${{ matrix.artifact }}/UNSIGNED-BUILD.txt
          shasum -a 256 release-${{ matrix.artifact }}/* > release-${{ matrix.artifact }}/SHA256SUMS.txt
          printf 'Component inventory for Hemo Tracker %s (%s)\n' "$GITHUB_REF_NAME" "${{ matrix.artifact }}" > release-${{ matrix.artifact }}/SBOM.txt
          find release-${{ matrix.artifact }} -maxdepth 1 -type f -printf '%f\n' | sort >> release-${{ matrix.artifact }}/SBOM.txt
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-${{ matrix.artifact }}
          path: release-${{ matrix.artifact }}

  draft-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t files < <(find release-artifacts -type f)
          gh release create "$GITHUB_REF_NAME" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "Hemo Tracker $GITHUB_REF_NAME (unsigned)" \
            --notes "This is an unsigned local V1 build. The operating system may show an unverified-publisher warning. Review the checksums and install procedure before publishing."
