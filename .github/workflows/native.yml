name: Native validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/native.yml"
      - "apps/desktop/package.json"
      - "apps/desktop/src-tauri/**"
      - "bun.lock"
      - "package.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/native.yml"
      - "apps/desktop/package.json"
      - "apps/desktop/src-tauri/**"
      - "bun.lock"
      - "package.json"

permissions:
  contents: read

concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tauri:
    name: Tauri build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundles: app
            executable: apps/desktop/src-tauri/target/release/hemo-tracker-desktop
          - os: windows-latest
            bundles: nsis
            executable: apps/desktop/src-tauri/target/release/hemo-tracker-desktop.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    env:
      CARGO_NET_RETRY: 5
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: bun install --frozen-lockfile
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
      - run:
          bun run --cwd apps/desktop tauri build --bundles ${{ matrix.bundles }}
      - name: Start the macOS desktop client
        if: runner.os == 'macOS'
        run: |
          "${{ matrix.executable }}" &
          app_pid=$!
          sleep 5
          kill -0 "$app_pid"
          kill "$app_pid"
      - name: Start the Windows desktop client
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $app = Start-Process -FilePath "${{ matrix.executable }}" -PassThru
          Start-Sleep -Seconds 5
          if ($app.HasExited) { throw "Hemo Tracker exited during startup" }
          Stop-Process -Id $app.Id
