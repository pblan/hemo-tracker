name: Native credential proof

on:
  workflow_dispatch:
    inputs:
      run_native_store:
        description: Change and clean up one native credential on each platform
        required: false
        default: false
        type: boolean
  pull_request:
    paths:
      - ".github/workflows/native-credential-proof.yml"
      - "proofs/native-credentials/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/native-credential-proof.yml"
      - "proofs/native-credentials/**"

permissions:
  contents: read

concurrency:
  group: native-credential-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name != 'workflow_dispatch' || !inputs.run_native_store
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: proofs/native-credentials
      - run:
          cargo fmt --manifest-path proofs/native-credentials/Cargo.toml --
          --check
      - run:
          cargo clippy --locked --manifest-path
          proofs/native-credentials/Cargo.toml --all-targets -- -D warnings
      - run:
          cargo test --locked --manifest-path
          proofs/native-credentials/Cargo.toml

  native-store:
    if: github.event_name == 'workflow_dispatch' && inputs.run_native_store
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: proofs/native-credentials
      - run:
          cargo test --locked --manifest-path
          proofs/native-credentials/Cargo.toml
          tests::native_store_round_trip_and_revocation -- --ignored --exact
