[package]
name = "hemo-native-credentials-proof"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
base64 = "0.22.1"
thiserror = "2.0.16"
zeroize = { version = "1.8.1", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", default-features = false, features = ["protected"] }
keyring-core = "1.0.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = ["Security_Credentials"] }
