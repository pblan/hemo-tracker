[package]
name = "hemo-tracker-desktop"
version = "0.1.0"
description = "Private, local-first laboratory result tracking"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "hemo_tracker_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hemo-encrypted-vault = { path = "../../../crates/encrypted-vault" }
hemo-key-lifecycle = { path = "../../../crates/key-lifecycle" }
hemo-source-file-encryption = { path = "../../../crates/source-file-encryption" }
getrandom = "0.3"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zeroize = { version = "1.9", features = ["derive"] }

[dev-dependencies]
tempfile = "=3.22.0"
