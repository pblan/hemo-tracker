[package]
name = "hemo-source-file-encryption"
version = "0.1.0"
edition = "2024"
publish = false

[features]
proofs = []

[dependencies]
getrandom = "=0.3.4"
hkdf = "=0.12.4"
libsodium-rs = { version = "=0.2.4", features = ["minimal"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
thiserror = "=2.0.20"
zeroize = { version = "=1.9.0", features = ["derive"] }
